# Copy to profile.yaml and fill in for this machine. profile.yaml is NEVER committed.
endpoints:
  anthropic: https://REPLACE-ME/anthropic
  openai: https://REPLACE-ME/openai/v1

provider_names:
  pi: { anthropic: REPLACE-ME, openai: REPLACE-ME }
  opencode: { anthropic: REPLACE-ME, openai: REPLACE-ME }
  vibe: { anthropic: REPLACE-ME, openai: REPLACE-ME }

# Bind every slot pi.yaml names (primary, alt-low, fast, research) on every
# machine: render stops if one is missing. Omit any other slot to emit no
# agent for it on this machine.
#
# thinking (optional) is the reasoning level. pi gets it as a `:level` suffix on
# the model ref, opencode as `variant:`, Claude Code as `effort:`.
#
# vibe_model (optional) is the vibe [[models]] ALIAS to select for this slot.
# Vibe stores `thinking` on the model alias rather than on the agent, so it can
# only reach a reasoning level by naming an alias that already carries one.
# Omit it and the bare `model` is used as the alias instead.
slots:
  primary:
    {
      provider: anthropic,
      model: REPLACE-ME,
      thinking: high,
      vibe_model: REPLACE-ME,
    }
  alt-low:
    {
      provider: openai,
      model: REPLACE-ME,
      thinking: low,
      vibe_model: REPLACE-ME,
    }
  alt:
    {
      provider: openai,
      model: REPLACE-ME,
      thinking: high,
      vibe_model: REPLACE-ME,
    }
  alt-xhigh:
    {
      provider: openai,
      model: REPLACE-ME,
      thinking: xhigh,
      vibe_model: REPLACE-ME,
    }
  fast: { provider: openai, model: REPLACE-ME }
  research: { provider: openai, model: REPLACE-ME, thinking: medium }

# Global software-engineering methodology: superpowers or compound-engineering.
# Selects the single methodology fragment appended after 00-universal.md.
methodology: superpowers

# Extra AGENTS.md fragments from agents.md.d/, appended after the methodology
# fragment.
agents_md_extra: []

# Extra shell exports emitted into profile.env.
env: {}
