# Vibe hook entries for the shared policy guard. EXAMPLE ONLY: this file is not
# installed. Append these blocks to ~/.vibe/hooks.toml by hand, keeping whatever
# is already there.
#
# The pre_tool match must survive every name the same tool goes by, because a
# name the regex misses is a tool the guard never sees:
#
#   Vibe 3.x    bash, file_system.bash, file_system.edit, file_system.write_file
#   background  process_start AND process.start (underscore or dot)
#   Pi          bash, edit, write (Pi's name for write_file)
#
# Hence `re:.*(bash|process[._]start|edit|write_file|write).*` — wrapped in
# `.*` so it matches a qualified name anywhere in the string, and with
# `process[._]start` covering both separators. An anchored list of bare names
# (`re:^(bash|edit)$`) silently stops guarding the moment a harness qualifies
# its tool names. hooks/policy.py accepts every one of these spellings.
#
# strict = true turns a hook failure into a deny. The pre-tool entries are
# strict because a guard that silently fails open is not a guard; the post-tool
# entry is not, because a redaction failure must not block a session.
#
# Site-specific roots come from ~/.config/agent-stack/policy.local.json
# (see policy.local.example.json). With no such file only the generic rules
# apply: `/`, `/mnt` and $HOME.

[[hooks]]
name = "agent-stack-policy-pre-tool"
type = "pre_tool"
match = "re:.*(bash|process[._]start|edit|write_file|write).*"
command = "python3 ~/.config/agent-stack/hooks/policy.py"
timeout = 10.0
strict = true
description = "Block destructive commands, force-pushes, signing bypasses, traced secrets and wide scans."

# The L2 ship-check gate: reruns deterministic checks inline for `git push` /
# `gh pr create`; `gh pr ready` and `gh pr merge` additionally require GitHub
# status checks to be successful for the exact PR head SHA.
[[hooks]]
name = "agent-stack-ship-check-gate"
type = "pre_tool"
match = "re:.*(bash|process[._]start).*"
command = "python3 ~/.config/agent-stack/hooks/ship_check_gate.py"
timeout = 30.0
strict = true
description = "Rerun ship-check inline for pushes and require PR CI before ready/merge."

[[hooks]]
name = "agent-stack-policy-post-tool"
type = "post_tool"
match = "re:bash|read_file|grep|web_fetch|web_search"
command = "python3 ~/.config/agent-stack/hooks/policy.py"
timeout = 10.0
strict = false
description = "Redact credentials from tool output before the model sees them."
