# Pi setup shared by every host. render.py merges `settings` and the
# slot-resolved `models` into Pi's settings.json, links `extensions` from
# the stack's pi/extensions directory, and runs `pi install` for missing
# `packages`. Model entries name profile.yaml slots, never concrete models.
# Every render replaces settings.extensions as a whole.
# Every render resets defaultModel, defaultProvider and defaultThinkingLevel, so
# model or thinking changes made in Pi's UI last only until the next render.
# compactAtTokens sets settings.compaction.modelOverrides from ~/.pi/agent/models.json.

# Auto-compact models whose context window is larger than this, at about this many tokens.
compactAtTokens: 500000
settings:
  defaultThinkingLevel: high
  theme: dark
  showCacheMissNotices: true
  compaction: { enabled: true, reserveTokens: 32768, keepRecentTokens: 20000 }
  retry: { enabled: true, maxRetries: 100 }
  extensions: ["-builtin:mcp"]
models:
  default: alt-low
  # Bounded work (well-specified coding, exploration, search) runs on the fast
  # slot; review and judgment-heavy roles keep stronger models.
  subagents:
    default: fast
    worker: fast
    delegate: fast
    reviewer: { slot: alt-low, thinking: medium }
    scout: fast
    researcher: research
    oracle: primary
    watchdog: primary
packages:
  - npm:pi-subagents
  - npm:pi-ask-user
  - npm:pi-mcp-adapter
  - npm:pi-agent-goal
  - npm:@trevonistrevon/pi-loop
  - npm:pi-zentui
  - npm:@dietrichgebert/ponytail
  - npm:pi-blackhole@0.5.11
extensions:
  - comment-discipline
  - goal-guard
  - subagent
  - worktree-guard
